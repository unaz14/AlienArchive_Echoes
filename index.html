<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe5" />
  <title>Dumpling Notes</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">A tiny community recipe wall</p>
      <h1>Leave a dumpling note.</h1>
      <p class="intro">
        Type it, sketch it, scribble it. Each answer becomes a little note on our shared wall.
      </p>
    </header>

    <section id="survey" class="survey" aria-label="Dumpling story prompts"></section>

    <section class="submit-area">
      <button id="submitBtn" class="primary-btn" type="button">Pin my notes to the wall</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="wallSection" class="wall-section" hidden>
      <div class="wall-header">
        <div>
          <p class="eyebrow">Community wall</p>
          <h2>What everyone left behind</h2>
        </div>
        <button id="refreshBtn" class="text-btn" type="button">Refresh</button>
      </div>

      <nav id="wallFilters" class="wall-filters" aria-label="Filter community notes"></nav>
      <div id="wall" class="wall" aria-live="polite"></div>
    </section>
  </main>

  <template id="questionTemplate">
    <article class="question-card sticky-note">
      <div class="question-topline">
        <span class="question-number"></span>
        <span class="tiny-label">answer your way</span>
      </div>
      <h2 class="question-title"></h2>
      <p class="question-hint"></p>

      <div class="text-panel">
        <textarea class="answer-text"></textarea>
      </div>

      <!-- <div class="mode-switch" role="tablist" aria-label="Answer mode">
        <button class="mode-btn is-active" data-mode="text" type="button" role="tab" aria-selected="true">Text</button>
        <button class="mode-btn" data-mode="draw" type="button" role="tab" aria-selected="false">Draw</button>
      </div>

      <div class="answer-panel text-panel">
        <textarea class="answer-text" rows="5"></textarea>
      </div>

      <div class="answer-panel draw-panel" hidden>
        <div class="canvas-wrap">
          <canvas class="draw-canvas" aria-label="Drawing area"></canvas>
          <span class="canvas-placeholder">draw here</span>
        </div>
        <div class="draw-tools">
          <label class="pen-size-label">
            Pen
            <input class="pen-size" type="range" min="2" max="14" value="5" />
          </label>
          <button class="clear-btn" type="button">Clear</button>
        </div>
      </div> -->
    </article>
  </template>

  <script src="app.js" defer></script>
</body>

</html>
